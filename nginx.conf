server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS（127.0.0.11），valid=10s 覆盖 Docker 默认 600s 的 TTL。
    # 下面 proxy_pass 用变量形式，nginx 才会按 resolver 重新解析域名；
    # 若写成字面量 http://gateway:8080，nginx 只在启动时解析一次并永久缓存，
    # gateway 容器一重建（IP 变化）就会一直 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api {
        set $gateway_upstream gateway:8080;
        proxy_pass http://$gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 网关重建期间的重试窗口，避免 IP 刚切换时的瞬时 502
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}